aid: lightelligence
name: Lightelligence
description: >-
  Lightelligence (legal entity Shanghai Xizhi Technology Co., Ltd. / 曦智科技, founded 2017 as an MIT
  spin-out) builds optoelectronic hybrid computing hardware — photonic accelerators and optical
  interconnect fabric for AI and high-performance computing. Its product line is physical: the PACE 2
  optoelectronic accelerated computing card (a PCIe Gen4 x16 accelerator built around a 128x128
  optical matrix multiplier), the Gazelle optical computing evaluation board, the Photowave CXL
  optical interconnect, and the Lightsphere X distributed optical circuit switch, supported by the
  company's oMAC, oNOC and oNET optical core, network-on-chip and inter-chip network technologies.
  The software surface is a device-side stack — ONNX, OpenCL, PyTorch and TVM support plus a Python
  SDK (lt_sdk) that compiled and ran models on the optical processing unit — not a web API. As of
  this profile the company publishes no public web API, no OpenAPI/AsyncAPI/GraphQL contract, and no
  developer portal; the lightelligence-sdk package and its Read the Docs reference have both been
  withdrawn. Its remaining public developer-facing surface is a GitHub organization of chip design
  and verification tooling (Bazel Verilog build rules, RTL/UVM linters, the yis interface-spec
  generator) and an Optical Computing Developer Community of research cases and papers.
